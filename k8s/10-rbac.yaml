apiVersion: v1
kind: ServiceAccount
metadata:
  name: forecast-api
  namespace: demand-forecast
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: demand-forecast
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-demand-forecast
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-demand-forecast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-demand-forecast
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: demand-forecast
